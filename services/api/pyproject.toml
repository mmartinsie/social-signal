[project]
name = "socialsignal-api"
version = "0.1.0"
description = "HTTP API and minimal UI to manage subscriptions and read sentiment summaries."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "socialsignal-common",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
socialsignal-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
