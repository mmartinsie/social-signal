[project]
name = "socialsignal-ingestor"
version = "0.1.0"
description = "Reads subscribed Bluesky handles and hashtags and stores their posts in PostgreSQL."
requires-python = ">=3.12"
dependencies = ["socialsignal-common"]

[tool.uv.sources]
socialsignal-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
