[project]
name = "socialsignal-worker"
version = "0.1.0"
description = "Classifies recent posts with the local LLM and stores per-subscription sentiment summaries."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "socialsignal-common",
]

[tool.uv.sources]
socialsignal-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
