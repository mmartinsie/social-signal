# PostgreSQL is the only bridge between zones: ingress on 5432 only from the
# ingestor, the API, the worker and the migration Job; no egress at all (the
# platform's default-deny covers it). The clients' matching egress rules live
# in the application chart.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-clients
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "socialsignal-db.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: postgres
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.ingest }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: ingestor
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.analysis }}
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [api, worker]
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: migrator
      ports:
        - protocol: TCP
          port: 5432
---
# Migration Job (application chart, pre-install/pre-upgrade hook): DNS and
# PostgreSQL only. It lives here, not with the Job, because Helm runs the
# hook before creating any of the application's resources: on a first
# install the Job would start without its policy and default-deny would cut
# it off. This release is installed first, so the rule already exists.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: migrator-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "socialsignal-db.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: migrator
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.dns.podLabels | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
