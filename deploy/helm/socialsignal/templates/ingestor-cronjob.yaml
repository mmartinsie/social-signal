{{- /*
Ingestors (A8, D18-D21): one CronJob per kind of subscription, in the
ingest zone, the only one with internet access. Both run the same image
with a different subcommand. Only the hashtag one mounts the optional
Bluesky credentials. The `ingestor` NetworkPolicy selects both through
app.kubernetes.io/component.
*/ -}}
{{- range $kind := list "handles" "hashtags" }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingestor-{{ $kind }}
  namespace: {{ $.Values.namespaces.ingest }}
  labels:
    {{- include "socialsignal.labels" $ | nindent 4 }}
    app.kubernetes.io/component: ingestor
spec:
  schedule: {{ index $.Values.ingestor.schedules $kind | quote }}
  # Never two runs at once: no duplicate work, no doubled load on Bluesky.
  concurrencyPolicy: Forbid
  # A run that cannot start within 2 minutes of its time (e.g. the cluster
  # was stopped) is skipped; the next one catches up, as writes are
  # idempotent.
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        {{- include "socialsignal.labels" $ | nindent 8 }}
        app.kubernetes.io/component: ingestor
    spec:
      # No immediate retry: the next scheduled run is the retry (A8).
      backoffLimit: 0
      activeDeadlineSeconds: {{ $.Values.ingestor.runDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "socialsignal.labels" $ | nindent 12 }}
            app.kubernetes.io/component: ingestor
            app.kubernetes.io/instance: {{ $.Release.Name }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            {{- include "socialsignal.podSecurityContext" $ | nindent 12 }}
          containers:
            - name: ingestor
              image: {{ required "images.ingestor is required (set by make start)" $.Values.images.ingestor }}
              imagePullPolicy: IfNotPresent
              command: [python, -m, socialsignal_ingestor, {{ $kind }}]
              env:
                {{- include "socialsignal.databaseEnv" (dict "root" $ "secret" $.Values.credentials.ingestor) | nindent 16 }}
                {{- if eq $kind "handles" }}
                - name: BLUESKY_PUBLIC_API_URL
                  value: {{ $.Values.ingestor.blueskyPublicApiUrl | quote }}
                - name: INGEST_POSTS_PER_HANDLE
                  value: {{ $.Values.ingestor.postsPerHandle | quote }}
                - name: INGEST_AUTHOR_FEED_FILTER
                  value: {{ $.Values.ingestor.authorFeedFilter | quote }}
                {{- else }}
                - name: BLUESKY_SEARCH_API_URL
                  value: {{ $.Values.ingestor.blueskySearchApiUrl | quote }}
                - name: BLUESKY_ENTRYWAY_URL
                  value: {{ $.Values.ingestor.blueskyEntrywayUrl | quote }}
                - name: INGEST_POSTS_PER_HASHTAG
                  value: {{ $.Values.ingestor.postsPerHashtag | quote }}
                - name: BLUESKY_CREDENTIALS_DIR
                  value: /run/secrets/bluesky
                {{- end }}
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                {{- include "socialsignal.containerSecurityContext" $ | nindent 16 }}
              volumeMounts:
                {{- include "socialsignal.databaseVolumeMount" $ | nindent 16 }}
                {{- if eq $kind "hashtags" }}
                - name: bluesky-credentials
                  mountPath: /run/secrets/bluesky
                  readOnly: true
                {{- end }}
          volumes:
            {{- include "socialsignal.databaseVolume" (dict "secret" $.Values.credentials.ingestor) | nindent 12 }}
            {{- if eq $kind "hashtags" }}
            # Optional: without .env there is no Secret and the directory is
            # empty, so hashtags are searched without authentication (A6).
            - name: bluesky-credentials
              secret:
                secretName: {{ $.Values.credentials.bluesky }}
                optional: true
                defaultMode: 0440
            {{- end }}
{{- end }}
