# Schema migrations (D1, D16). A Helm hook that runs before every install and
# upgrade, before any other resource of this release is created or changed.
# If it fails, Helm aborts the release and no new application version is
# rolled out. Its NetworkPolicy lives in the socialsignal-db chart, which is
# installed first.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrations
  namespace: {{ .Values.namespaces.data }}
  labels:
    {{- include "socialsignal.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrator
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    # Keep the finished Job, and its logs, until the next run replaces it.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "socialsignal.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrator
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- include "socialsignal.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrations
          image: {{ required "images.migrations is required (set by make start)" .Values.images.migrations }}
          imagePullPolicy: IfNotPresent
          command: [python, -m, socialsignal_migrations]
          env:
            {{- include "socialsignal.databaseEnv" (dict "root" . "secret" .Values.credentials.migrator) | nindent 12 }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            {{- include "socialsignal.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "socialsignal.databaseVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "socialsignal.databaseVolume" (dict "secret" .Values.credentials.migrator) | nindent 8 }}
