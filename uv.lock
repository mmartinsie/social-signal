version = 1
revision = 3
requires-python = ">=3.12"

[manifest]
members = [
    "socialsignal-api",
    "socialsignal-common",
    "socialsignal-ingestor",
    "socialsignal-worker",
]

[[package]]
name = "socialsignal-api"
version = "0.1.0"
source = { editable = "services/api" }
dependencies = [
    { name = "socialsignal-common" },
]

[package.metadata]
requires-dist = [{ name = "socialsignal-common", editable = "packages/common" }]

[[package]]
name = "socialsignal-common"
version = "0.1.0"
source = { editable = "packages/common" }

[[package]]
name = "socialsignal-ingestor"
version = "0.1.0"
source = { editable = "services/ingestor" }
dependencies = [
    { name = "socialsignal-common" },
]

[package.metadata]
requires-dist = [{ name = "socialsignal-common", editable = "packages/common" }]

[[package]]
name = "socialsignal-worker"
version = "0.1.0"
source = { editable = "services/worker" }
dependencies = [
    { name = "socialsignal-common" },
]

[package.metadata]
requires-dist = [{ name = "socialsignal-common", editable = "packages/common" }]
